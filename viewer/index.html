<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órbita · Visor de assets</title>
  <style>
    body { margin: 0; padding: 16px; background: #0b0f1a; color: #e6edf7; font: 13px/1.35 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: -16px -16px 14px; padding: 12px 16px; background: #0b0f1a; border-bottom: 1px solid rgba(140,170,210,.2); }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    h2 { margin: 20px 0 10px; font-size: 15px; font-weight: 600; }
    label { color: #93a3bb; }
    #buscar { padding: 6px 10px; min-width: 200px; color: inherit; background: #121829; border: 1px solid rgba(140,170,210,.3); border-radius: 6px; font: inherit; }
    #tipos, #categorias { display: flex; flex-wrap: wrap; gap: 4px; }
    #categorias { order: 5; width: 100%; }
    #tipos button, #categorias button { min-height: 32px; padding: 0 10px; color: #cdd8e8; background: #121829; border: 1px solid rgba(140,170,210,.3); border-radius: 6px; font: inherit; cursor: pointer; }
    #categorias button { min-height: 28px; font-size: 12px; }
    #tipos button.activo, #categorias button.activo { color: #0b0f1a; background: #7fd3f2; border-color: #7fd3f2; font-weight: 600; }
    .etiqueta { display: inline-block; margin-bottom: 2px; padding: 0 5px; font-size: 11px; color: #cdd8e8; background: rgba(127,211,242,.15); border-radius: 3px; }
    #estado { color: #93a3bb; margin-left: auto; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    figure { margin: 0; padding: 6px; cursor: pointer; background: #121829; border: 1px solid rgba(140,170,210,.2); border-radius: 8px; }
    figure.usado { border-color: rgba(95,206,140,.65); }
    figure[hidden] { display: none; }
    canvas, figure img { width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; background: #0a0e18; object-fit: contain; }
    figcaption { padding: 6px 2px 2px; }
    .check { display: block; font-weight: 600; color: #6b7a91; }
    .usado .check { color: #5fce8c; }
    code { display: block; color: #7fd3f2; font: 11px ui-monospace, Menlo, monospace; word-break: break-all; }
    small { display: block; color: #93a3bb; }
    figure:hover, figure:focus-visible { outline: 2px solid #7fd3f2; outline-offset: -1px; }
    dialog { width: min(1000px, calc(100vw - 32px)); height: min(760px, calc(100vh - 32px)); padding: 0; color: inherit; background: #0e1320; border: 1px solid rgba(140,170,210,.35); border-radius: 10px; }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(5,8,16,.75); }
    dialog header { position: static; margin: 0; flex-wrap: nowrap; }
    #modal-titulo { min-width: 0; }
    #modal-titulo code { font-size: 13px; }
    #modal-cerrar { flex: none; width: 36px; height: 36px; margin-left: auto; color: inherit; background: none; border: 1px solid rgba(140,170,210,.3); border-radius: 6px; cursor: pointer; }
    #modal-vista { position: relative; flex: 1; min-height: 0; background: radial-gradient(circle at 50% 55%, #1b2640, #0b101c 72%); }
    #modal-canvas { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; background: none; border-radius: 0; cursor: grab; touch-action: none; }
    #modal-canvas:active { cursor: grabbing; }
    #modal-img { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; background: none; }
    #modal-fx { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 170px; padding: 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; background: rgba(14,19,32,.82); border: 1px solid rgba(140,170,210,.25); border-radius: 8px; }
    #modal-fx[hidden] { display: none; }
    #modal-fx label { color: #cdd8e8; }
    #modal-fx input { width: 100%; margin: 6px 0 0; }
    #modal-fx h3 { margin: 8px 0 2px; font-size: 12px; font-weight: 600; color: #93a3bb; }
    #modal-fx button { flex: none; min-height: 30px; padding: 0 8px; text-align: left; color: #cdd8e8; background: #121829; border: 1px solid rgba(140,170,210,.3); border-radius: 6px; font: inherit; cursor: pointer; }
    #modal-fx button:hover { border-color: #7fd3f2; }
    #modal-fx button[aria-pressed="true"] { color: #0b0f1a; background: #7fd3f2; border-color: #7fd3f2; font-weight: 600; }
    #modal-ayuda { position: absolute; left: 12px; bottom: 10px; color: #93a3bb; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>Visor de assets</h1>
    <input id="buscar" type="search" placeholder="Buscar por nombre…" aria-label="Buscar por nombre">
    <div id="tipos" role="group" aria-label="Filtrar por tipo"></div>
    <div id="categorias" role="group" aria-label="Filtrar por categoría"></div>
    <label><input type="checkbox" id="solo-uso"> Solo en uso</label>
    <label><input type="checkbox" id="escala-real"> Escala real (piezas en uso)</label>
    <span id="estado">Cargando…</span>
  </header>
  <h2 id="titulo-modelos"></h2>
  <div class="rejilla" id="modelos"></div>
  <h2 id="titulo-texturas"></h2>
  <div class="rejilla" id="texturas"></div>
  <dialog id="modal" aria-label="Vista ampliada">
    <header>
      <div id="modal-titulo"></div>
      <button id="modal-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div id="modal-vista">
      <canvas id="modal-canvas"></canvas>
      <img id="modal-img" alt="" hidden>
      <span id="modal-ayuda">Arrastra para rotar · rueda para acercar</span>
      <aside id="modal-fx" aria-label="Probar efectos" hidden>
        <label>Motores: <b id="fx-empuje-txt"></b>
          <input id="fx-empuje" type="range" min="0" max="1.9" step="0.05">
        </label>
        <small id="fx-nota"></small>
        <h3>Una vez</h3>
        <button data-accion="disparo">Disparo</button>
        <button data-accion="casco">Impacto en casco</button>
        <button data-accion="escudo">Impacto en escudo</button>
        <button data-accion="pulso">Pulso</button>
        <button data-accion="rayo">Rayo</button>
        <button data-accion="explosion">Explosión</button>
        <h3>Continuo</h3>
        <button data-continuo="fuego" aria-pressed="false">Fuego continuo</button>
        <button data-continuo="barrera" aria-pressed="false">Barrera</button>
        <button data-continuo="blindaje" aria-pressed="false">Blindaje</button>
        <button data-continuo="humo" aria-pressed="false">Humo de daño</button>
        <button data-continuo="invisible" aria-pressed="false">Invisible</button>
      </aside>
    </div>
  </dialog>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
